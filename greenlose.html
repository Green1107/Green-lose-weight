<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小绿减重日记</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f7f4;
    color: #2d3748;
    line-height: 1.6;
    padding-bottom: 40px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }

  /* 顶部标语 */
  .hero {
    background: linear-gradient(135deg, #48bb78, #38b2ac);
    color: #fff;
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(72,187,120,.3);
  }
  .hero .badge { font-size: 12px; opacity: .9; letter-spacing: 1px; }
  .hero h1 { font-size: 24px; font-weight: 800; margin: 8px 0 6px; }
  .hero .slogan { font-size: 14px; opacity: .95; }
  .hero .sub { font-size: 12px; opacity: .85; margin-top: 10px; }

  /* ===== 6个统计卡片 ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 16px;
  }
  .stat-card {
    background: #fff;
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(72,187,120,.1);
    border: 1.5px solid #c6f6d5;
  }
  .stat-card .stat-label { font-size: 11px; color: #68d391; font-weight: 600; margin-bottom: 4px; }
  .stat-card .stat-value { font-size: 22px; font-weight: 800; color: #2d3748; }
  .stat-card .stat-sub { font-size: 10px; color: #a0aec0; margin-top: 2px; }
  .stat-value.down { color: #48bb78; }
  .stat-value.up { color: #48bb78; }

  /* 卡片 */
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 18px;
    margin-top: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .card h2 {
    font-size: 16px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card h2 .tag {
    font-size: 11px;
    background: #e6fffa;
    color: #319795;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }

  /* 表单 */
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #4a5568;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field .hint { font-size: 11px; color: #a0aec0; font-weight: 400; }
  .field input, .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    font-size: 15px;
    transition: border .2s;
    background: #fff;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: #48bb78;
  }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }

  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: linear-gradient(135deg, #48bb78, #38b2ac); color: #fff; width: 100%; margin-top: 8px; }
  .btn-primary:hover { box-shadow: 0 4px 16px rgba(72,187,120,.4); }
  .btn-secondary {
    background: #edf2f7; color: #4a5568; padding: 8px 14px; font-size: 13px; font-weight: 600;
    border-radius: 10px; border: none; cursor: pointer; margin: 4px 4px 4px 0;
  }
  .btn-secondary:hover { background: #e2e8f0; }

  /* 图表 */
  .chart-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .chart-tab {
    padding: 6px 14px;
    border-radius: 20px;
    background: #edf2f7;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    color: #4a5568;
    transition: all .2s;
  }
  .chart-tab.active { background: #48bb78; color: #fff; }
  .chart-box { position: relative; height: 280px; }

  /* 历史记录 */
  .record-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-radius: 10px;
    background: #f7fafc;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .record-item .date { font-weight: 700; color: #2d3748; }
  .record-item .vals { color: #4a5568; }
  .record-item .del {
    color: #e53e3e;
    cursor: pointer;
    font-size: 18px;
    padding: 0 6px;
  }
  .empty { text-align: center; color: #a0aec0; padding: 30px; font-size: 14px; }
  .vals { font-weight: 700; }

  .toolbar { margin-bottom: 12px; }
  .note { font-size: 12px; color: #718096; margin-top: 10px; line-height: 1.7; }
  .section-divider {
    border: none;
    border-top: 1px dashed #e2e8f0;
    margin: 16px 0 4px;
  }
  .section-title {
    font-size: 13px;
    color: #48bb78;
    font-weight: 700;
    margin: 12px 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶部标语 -->
  <div class="hero">
    <div class="badge">HEALTHY LIFE</div>
    <h1>🌿 小绿减重日记</h1>
    <div class="slogan">终有弱水替沧海，再无相思寄巫山</div>
    <div class="sub" id="heroSub">已记录 0 天 · 累计变化 -- 斤</div>
  </div>

  <!-- ===== 6个统计卡片 ===== -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">起始体重</div>
      <div class="stat-value" id="statStart">-</div>
      <div class="stat-sub" id="statStartSub">首次记录</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">当前体重</div>
      <div class="stat-value" id="statCur">-</div>
      <div class="stat-sub" id="statCurSub">最近一次</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">累计变化</div>
      <div class="stat-value" id="statTotal">-</div>
      <div class="stat-sub" id="statTotalSub">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">较前一天</div>
      <div class="stat-value" id="statDaily">-</div>
      <div class="stat-sub" id="statDailySub">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">当前 BMI</div>
      <div class="stat-value" id="statBmi">-</div>
      <div class="stat-sub">18.5~24正常</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">距目标</div>
      <div class="stat-value" id="statGoal">-</div>
      <div class="stat-sub" id="statGoalSub">目标100斤</div>
    </div>
  </div>

  <!-- 录入表单 -->
  <div class="card">
    <h2>📝 每日记录 <span class="tag">身高 160cm </span></h2>

    <div class="section-title">🔥 请填写</div>

    <div class="field-row">
      <div class="field">
        <label>日期</label>
        <input type="date" id="f_date">
      </div>
      <div class="field">
        <label>⭐ 体重 (斤) <span class="hint">核心指标</span></label>
        <input type="number" step="0.01" id="f_weight" placeholder="如 119.00">
      </div>
    </div>

    <div class="field">
      <label>每日备注 <span class="hint">可选</span></label>
      <input type="text" id="f_note" placeholder="如：今天运动了 / 吃多了">
    </div>

    <hr class="section-divider">

    <div class="section-title">🔒 自动填入，有变化再改</div>

    <div class="field-row">
      <div class="field">
        <label>体脂率 (%)</label>
        <input type="number" step="0.1" id="f_bodyfat" placeholder="31.0">
      </div>
      <div class="field">
        <label>BMI</label>
        <input type="number" step="0.1" id="f_bmi" placeholder="自动计算">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>骨骼肌率 (%)</label>
        <input type="number" step="0.1" id="f_skeletal" placeholder="43.0">
      </div>
      <div class="field">
        <label>肌肉率 (%)</label>
        <input type="number" step="0.1" id="f_muscle" placeholder="64.0">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>水分 (%)</label>
        <input type="number" step="0.1" id="f_water" placeholder="54.0">
      </div>
      <div class="field">
        <label>基础代谢 (kcal)</label>
        <input type="number" step="0.1" id="f_metabolism" placeholder="1415.5">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>脂肪重量 (斤)</label>
        <input type="number" step="0.01" id="f_fatweight" placeholder="36.88">
      </div>
      <div class="field">
        <label>皮下脂肪 (%)</label>
        <input type="number" step="0.1" id="f_subfat" placeholder="21.0">
      </div>
    </div>

    <button class="btn btn-primary" onclick="saveRecord()">💾 保存记录</button>
    <p class="note">💡 BMI 自动按身高 160cm 计算；不常变的指标会自动填入上次数据，只需改体重即可。</p>
  </div>

  <!-- 图表 -->
  <div class="card">
    <h2>📈 趋势图表</h2>
    <div class="chart-tabs">
      <button class="chart-tab active" onclick="switchChart('weight', this)">体重 (斤)</button>
      <button class="chart-tab" onclick="switchChart('bodyfat', this)">体脂率 (%)</button>
      <button class="chart-tab" onclick="switchChart('bmi', this)">BMI</button>
    </div>
    <div class="chart-box">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="card">
    <h2>📋 历史记录</h2>
    <div class="toolbar">
      <button class="btn-secondary" onclick="exportCSV()">⬇️ 下载CSV</button>
      <button class="btn-secondary" onclick="clearAll()">🗑️ 清空</button>
    </div>
    <div id="historyList"></div>
  </div>

</div>

<script>
// ===== 配置 =====
const HEIGHT_M = 1.60;
const GOAL_WEIGHT = 100;  // 目标体重（斤），可自行修改

// ===== 数据层 =====
let records = [];

function load() {
  try {
    const s = localStorage.getItem('bodyRecords');
    if (s) records = JSON.parse(s);
  } catch(e) {}
}
function save() {
  localStorage.setItem('bodyRecords', JSON.stringify(records));
}

// ===== 6天真实数据 =====
function getDemoData() {
  return [
    { date:'2026-09-06', weight:121.30, note:'第1天', bodyfat:31.0, bmi:23.7, skeletal:42.0, muscle:64.0, water:53.0, metabolism:1426.5, fatweight:37.60, subfat:21.0 },
    { date:'2026-09-07', weight:121.30, note:'体重稳定', bodyfat:31.0, bmi:23.7, skeletal:42.0, muscle:64.0, water:53.0, metabolism:1426.5, fatweight:37.60, subfat:21.0 },
    { date:'2026-09-08', weight:120.50, note:'下降0.8斤', bodyfat:31.0, bmi:23.5, skeletal:42.0, muscle:64.0, water:54.0, metabolism:1422.7, fatweight:37.36, subfat:21.0 },
    { date:'2026-09-09', weight:120.10, note:'下降0.4斤', bodyfat:31.0, bmi:23.5, skeletal:43.0, muscle:64.0, water:54.0, metabolism:1420.8, fatweight:37.24, subfat:21.0 },
    { date:'2026-09-10', weight:119.20, note:'下降0.9斤', bodyfat:31.0, bmi:23.3, skeletal:43.0, muscle:64.0, water:54.0, metabolism:1416.5, fatweight:36.96, subfat:21.0 },
    { date:'2026-09-11', weight:119.00, note:'下降0.2斤', bodyfat:31.0, bmi:23.2, skeletal:43.0, muscle:64.0, water:54.0, metabolism:1415.5, fatweight:36.88, subfat:21.0 },
  ];
}

function loadDemo() {
  records = getDemoData();
  save();
  renderAll();
  alert('✅ 已载入 6 天示例数据！');
}

// ===== BMI =====
function calcBMI(weightJin) {
  const kg = weightJin / 2;
  return +(kg / (HEIGHT_M * HEIGHT_M)).toFixed(1);
}

// ===== 自动填入 =====
function autoFill() {
  if (records.length === 0) return;
  const last = records[records.length - 1];
  const setVal = (id, val) => { const el = document.getElementById(id); if (el && !el.value && val != null) el.value = val; };
  setVal('f_bodyfat', last.bodyfat);
  setVal('f_bmi', last.bmi);
  setVal('f_skeletal', last.skeletal);
  setVal('f_muscle', last.muscle);
  setVal('f_water', last.water);
  setVal('f_metabolism', last.metabolism);
  setVal('f_fatweight', last.fatweight);
  setVal('f_subfat', last.subfat);
}

// ===== 保存 =====
function saveRecord() {
  const date = document.getElementById('f_date').value;
  const weight = parseFloat(document.getElementById('f_weight').value);

  if (!date || !weight) {
    alert('请至少填写「日期」和「体重」');
    return;
  }

  const bmi = document.getElementById('f_bmi').value
    ? parseFloat(document.getElementById('f_bmi').value)
    : calcBMI(weight);

  const rec = {
    date,
    weight,
    note: document.getElementById('f_note').value || '',
    bodyfat: parseFloat(document.getElementById('f_bodyfat').value) || null,
    bmi,
    skeletal: parseFloat(document.getElementById('f_skeletal').value) || null,
    muscle: parseFloat(document.getElementById('f_muscle').value) || null,
    water: parseFloat(document.getElementById('f_water').value) || null,
    metabolism: parseFloat(document.getElementById('f_metabolism').value) || null,
    fatweight: parseFloat(document.getElementById('f_fatweight').value) || null,
    subfat: parseFloat(document.getElementById('f_subfat').value) || null,
  };

  const idx = records.findIndex(r => r.date === date);
  if (idx >= 0) records[idx] = rec;
  else records.push(rec);

  records.sort((a, b) => a.date.localeCompare(b.date));
  save();
  renderAll();
  alert('✅ 已保存！');
}

// ===== 删除 =====
function delRecord(date) {
  if (!confirm('删除这条记录？')) return;
  records = records.filter(r => r.date !== date);
  save();
  renderAll();
}

// ===== 导出 CSV（只保留这个）=====
function exportCSV() {
  if (records.length === 0) { alert('暂无数据'); return; }
  const sorted = [...records].sort((a,b) => a.date.localeCompare(b.date));
  let csv = '\uFEFF日期,体重(斤),体脂率(%),BMI,骨骼肌率(%),肌肉率(%),水分(%),基础代谢,脂肪重量(斤),皮下脂肪(%),备注\n';
  sorted.forEach(r => {
    csv += `${r.date},${r.weight},${r.bodyfat||''},${r.bmi||''},${r.skeletal||''},${r.muscle||''},${r.water||''},${r.metabolism||''},${r.fatweight||''},${r.subfat||''},${r.note||''}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '小绿减脂日记_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function clearAll() {
  if (!confirm('确定清空所有数据？此操作不可恢复')) return;
  records = [];
  save();
  renderAll();
}

// ===== 6个统计卡片更新 =====
function renderStats() {
  if (records.length === 0) {
    ['statStart','statCur','statTotal','statDaily','statBmi','statGoal'].forEach(id => {
      document.getElementById(id).textContent = '-';
    });
    document.getElementById('statTotalSub').textContent = '';
    document.getElementById('statDailySub').textContent = '';
    document.getElementById('statGoalSub').textContent = '目标' + GOAL_WEIGHT + '斤';
    return;
  }
  const sorted = [...records].sort((a,b) => a.date.localeCompare(b.date));
  const first = sorted[0];
  const cur = sorted[sorted.length - 1];
  const start = first.weight;
  const current = cur.weight;
  const total = current - start;
  const daily = sorted.length > 1 ? current - sorted[sorted.length - 2].weight : null;
  const goalDiff = current - GOAL_WEIGHT;

  // 起始体重
  document.getElementById('statStart').textContent = start.toFixed(1);
  document.getElementById('statStartSub').textContent = first.date.slice(5);

  // 当前体重
  document.getElementById('statCur').textContent = current.toFixed(1);
  document.getElementById('statCurSub').textContent = cur.date.slice(5);

  // 累计变化
  const totalEl = document.getElementById('statTotal');
  totalEl.textContent = (total > 0 ? '+' : '') + total.toFixed(1);
  totalEl.className = 'stat-value ' + (total < 0 ? 'down' : total > 0 ? 'up' : '');
  document.getElementById('statTotalSub').textContent = total < 0 ? '已减 ' + (-total).toFixed(1) + ' 斤 🎉' : total > 0 ? '增加 ' + total.toFixed(1) + ' 斤' : '持平';

  // 较前一天
  const dailyEl = document.getElementById('statDaily');
  if (daily !== null) {
    dailyEl.textContent = (daily > 0 ? '+' : '') + daily.toFixed(1);
    dailyEl.className = 'stat-value ' + (daily < 0 ? 'down' : daily > 0 ? 'up' : '');
    document.getElementById('statDailySub').textContent = daily < 0 ? '比昨天轻' : daily > 0 ? '比昨天重' : '和昨天一样';
  } else {
    dailyEl.textContent = '-';
    document.getElementById('statDailySub').textContent = '';
  }

  // BMI
  document.getElementById('statBmi').textContent = cur.bmi ? cur.bmi.toFixed(1) : calcBMI(current).toFixed(1);

  // 距目标
  const goalEl = document.getElementById('statGoal');
  if (goalDiff > 0) {
    goalEl.textContent = goalDiff.toFixed(1) + '斤';
    goalEl.className = 'stat-value up';
    document.getElementById('statGoalSub').textContent = '还差 ' + goalDiff.toFixed(1) + ' 斤';
  } else {
    goalEl.textContent = '已达成✅';
    goalEl.className = 'stat-value down';
    document.getElementById('statGoalSub').textContent = '恭喜达成目标！';
  }
}

// ===== 顶部标语 =====
function renderHero() {
  const sub = document.getElementById('heroSub');
  if (records.length === 0) {
    sub.textContent = '暂无数据 · 开始你的减脂第一天吧';
    return;
  }
  const sorted = [...records].sort((a,b) => a.date.localeCompare(b.date));
  const latest = sorted[sorted.length - 1];
  const first = sorted[0];
  const total = latest.weight - first.weight;
  const totalStr = total <= 0 ? `已减 ${(-total).toFixed(2)}` : `增加 ${total.toFixed(2)}`;
  sub.textContent = `已记录 ${sorted.length} 天 · 累计 ${totalStr} 斤`;
}

// ===== 图表 =====
let chart = null;
let currentMetric = 'weight';

function metricMeta(metric) {
  const map = {
    weight:   { label:'体重 (斤)',  color:'#48bb78', unit:'斤' },
    bodyfat:  { label:'体脂率 (%)', color:'#ed8936', unit:'%'  },
    bmi:      { label:'BMI',       color:'#38b2ac', unit:''   },
  };
  return map[metric];
}

function renderChart() {
  const sorted = [...records].sort((a,b) => a.date.localeCompare(b.date));
  const labels = sorted.map(r => r.date.slice(5));
  const data = sorted.map(r => r[currentMetric]);
  const meta = metricMeta(currentMetric);

  const ctx = document.getElementById('trendChart').getContext('2d');
  if (chart) chart.destroy();

  const grad = ctx.createLinearGradient(0, 0, 0, 280);
  grad.addColorStop(0, meta.color + '33');
  grad.addColorStop(1, meta.color + '00');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: meta.label,
        data,
        borderColor: meta.color,
        backgroundColor: grad,
        borderWidth: 3,
        pointBackgroundColor: '#fff',
        pointBorderColor: meta.color,
        pointBorderWidth: 2.5,
        pointRadius: 6,
        pointHoverRadius: 8,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 20, bottom: 8 } },
      interaction: { intersect: false, mode: 'nearest' },
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: true,
          padding: 10,
          displayColors: false,
          callbacks: {
            label: (ctx) => `${meta.label}: ${ctx.parsed.y}${meta.unit}`
          }
        },
        afterDatasetsDraw(chart) {
          const {ctx: c, data: cd} = chart;
          const meta2 = chart.getDatasetMeta(0);
          c.save();
          c.font = 'bold 12px sans-serif';
          c.fillStyle = '#2d3748';
          c.textAlign = 'center';
          c.textBaseline = 'bottom';
          meta2.data.forEach((point, i) => {
            const val = cd.datasets[0].data[i];
            if (val == null) return;
            const txt = currentMetric === 'weight' ? val.toFixed(1) : val;
            c.fillText(txt, point.x, point.y - 8);
          });
          c.restore();
        }
      },
      scales: {
        y: {
          beginAtZero: false,
          ticks: { font: { size: 11 } },
          grid: { color: '#edf2f7' }
        },
        x: {
          ticks: { font: { size: 11 } },
          grid: { display: false }
        }
      }
    }
  });
}

function switchChart(metric, btn) {
  currentMetric = metric;
  document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChart();
}

// ===== 历史列表 =====
function renderHistory() {
  const box = document.getElementById('historyList');
  if (records.length === 0) {
    box.innerHTML = '<div class="empty">暂无数据，请先录入或载入示例数据</div>';
    return;
  }
  // 正序排列（用于找前一天）
  const sortedAsc = [...records].sort((a,b) => a.date.localeCompare(b.date));
  // 倒序展示（最新的在前面）
  const sorted = [...sortedAsc].reverse();
  // ★ 新增：只显示最新10条
  const showList = sorted.slice(0, 10);

  box.innerHTML = showList.map(r => {
    // 找当前记录在正序数组中的索引
    const idx = sortedAsc.findIndex(x => x.date === r.date);
    // 前一天 = 正序中前一条
    const prev = idx > 0 ? sortedAsc[idx - 1] : null;
    const diff = prev ? (r.weight - prev.weight) : 0;

    // 涨=红▲，降=绿▼，没变=灰→
    let arrow = '→';
    let cls = '';
    if (diff < 0) { arrow = '✅️'; cls = 'down'; }
    else if (diff > 0) { arrow = '🔺'; cls = 'up'; }

    return `
    <div class="record-item">
      <div>
        <div class="date">${r.date}</div>
        <div class="vals">体脂 ${r.bodyfat || '--'}% · BMI ${r.bmi || '--'}</div>
      </div>
      <div style="text-align:right">
        <div class="date">${r.weight.toFixed(2)} 斤</div>
        <div class="vals ${cls}">${arrow} ${diff > 0 ? '+' : ''}${diff.toFixed(2)}</div>
      </div>
      <div class="del" onclick="delRecord('${r.date}')">×</div>
    </div>`;
  }).join('');
}

// ===== 总渲染 =====
function renderAll() {
  renderStats();
  renderHero();
  renderChart();
  renderHistory();
}

// ===== 初始化 =====
function init() {
  load();
  if (records.length === 0) {
    records = getDemoData();
    save();
  }
  document.getElementById('f_date').value = new Date().toISOString().slice(0,10);
  autoFill();
  renderAll();
}
init();
</script>
